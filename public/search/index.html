<main class="main"><style>
body { font-size: 14px; line-height: 1.5; }

.search-result .match-info { color: #888; font-size: 0.8rem; margin-top: 0.3rem; }
.no-results { color: #888; text-align: center; padding: 1rem; }
#status { color: #888; text-align: center; padding: 1rem; }
</style>

<div class="search-box">
  <input type="text" id="search-input" placeholder="搜尋章節內容..." oninput="doSearch()">
  <div id="status"></div>
  <div id="search-results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script>
var fuse;
var pages = [];

async function init() {
  document.getElementById('status').textContent = '載入搜尋索引...';
  try {
    var base = '/Harriet_lane/';
    var res = await fetch(base + 'index.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    pages = await res.json();
    fuse = new Fuse(pages, {
      keys: ['Title', 'Summary'],
      threshold: 0.4
    });
    document.getElementById('status').textContent = '已載入 ' + pages.length + ' 個章節';
    setTimeout(function() { document.getElementById('status').textContent = ''; }, 2000);
  } catch(e) {
    document.getElementById('status').textContent = '載入失敗: ' + e.message;
  }
}

function doSearch() {
  var query = document.getElementById('search-input').value.trim();
  var resultsDiv = document.getElementById('search-results');
  if (!query) { resultsDiv.innerHTML = ''; return; }
  if (!fuse) { resultsDiv.innerHTML = '<p class="no-results">索引尚未載入，請稍候</p>'; return; }
  var results = fuse.search(query).slice(0, 15);
  if (results.length === 0) {
    resultsDiv.innerHTML = '<p class="no-results">沒有找到符合「' + query + '」的結果</p>';
    return;
  }
  var html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var chapterMatch = r.item.Permalink.match(/\/ch(\d+)-/);
    var chapter = chapterMatch ? 'Chapter ' + chapterMatch[1] : '';
    html += '<div class="search-result"><a href="' + r.item.Permalink + '">' + r.item.Title + '</a>';
    html += '<div class="match-info">在 ' + chapter + ' 中找到</div></div>';
  }
  resultsDiv.innerHTML = html;
}

init();
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })
