{{- define "main" -}}
<style>
body { font-size: 14px; line-height: 1.5; }
.search-box { max-width: 600px; margin: 1rem auto; }
#search-input { width: 100%; padding: 0.8rem; font-size: 1rem; border: 1px solid #333; border-radius: 8px; background: #1e1e1e; color: #e0e0e0; box-sizing: border-box; }
#search-results { margin-top: 1rem; }
.search-result { padding: 0.8rem; margin-bottom: 0.5rem; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; }
.search-result a { color: #60a5fa; text-decoration: none; font-size: 1rem; font-weight: 600; }
.search-result a:hover { color: #93c5fd; }
.search-result .match-info { color: #888; font-size: 0.8rem; margin-top: 0.3rem; }
.no-results { color: #888; text-align: center; padding: 1rem; }
</style>

<div class="search-box">
  <input type="text" id="search-input" placeholder="搜尋章節內容..." oninput="search()">
  <div id="search-results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script>
var fuse;
var jsonData = [];

async function loadSearch() {
  var res = await fetch('/index.json');
  jsonData = await res.json();
  fuse = new Fuse(jsonData, {
    keys: [
      { name: 'Title', weight: 2 },
      { name: 'Summary', weight: 1 },
      { name: 'Content', weight: 0.5 }
    ],
    includeMatches: true,
    threshold: 0.4
  });
}

function search() {
  var query = document.getElementById('search-input').value.trim();
  var resultsDiv = document.getElementById('search-results');
  
  if (!query) {
    resultsDiv.innerHTML = '';
    return;
  }
  
  if (!fuse) {
    resultsDiv.innerHTML = '<p class="no-results">載入中...</p>';
    return;
  }
  
  var results = fuse.search(query).slice(0, 15);
  
  if (results.length === 0) {
    resultsDiv.innerHTML = '<p class="no-results">沒有找到符合的結果</p>';
    return;
  }
  
  var html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var chapterNum = r.item.Permalink.match(/\/ch(\d+)-/);
    var chapterText = chapterNum ? 'Chapter ' + chapterNum[1] : '';
    html += '<div class="search-result"><a href="' + r.item.Permalink + '">' + r.item.Title + '</a>';
    if (r.item.Summary && r.item.Summary.indexOf(query) >= 0) {
      html += '<div class="match-info">在 ' + chapterText + ' 的導讀摘要中找到關鍵字</div>';
    } else {
      html += '<div class="match-info">在 ' + chapterText + ' 中找到</div>';
    }
    html += '</div>';
  }
  resultsDiv.innerHTML = html;
}

loadSearch();
</script>
{{- end -}}
