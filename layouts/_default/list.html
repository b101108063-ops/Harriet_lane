{{- define "main" -}}
<style>
body { font-size: 14px; line-height: 1.5; }
.post-item { margin-bottom: 0.75rem; }
.post-item .card {
  border: 1px solid #333;
  border-radius: 8px;
  padding: 0.8rem 1rem;
  background: #1e1e1e;
  transition: all 0.2s;
}
.post-item .card:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  border-color: #60a5fa;
}
.post-item .card h2 {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 600;
}
.post-item .card a {
  text-decoration: none;
  color: #e0e0e0;
}
.post-item .card a:hover {
  color: #60a5fa;
}
.main-content { max-width: 100%; padding: 1rem; }
</style>

<div class="main-content">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.75rem;">
{{- $pages := .Site.RegularPages -}}
{{- range $pages.ByWeight -}}
<div class="post-item">
  <a href="{{ .RelPermalink }}">
    <div class="card">
      <h2>{{ .Title }}</h2>
    </div>
  </a>
</div>
{{- end -}}
</div>
</div>
{{- end -}}
