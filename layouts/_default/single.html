<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-size: 15px; 
      line-height: 1.7; 
      background: #1a1a1a; 
      color: #d0d0d0;
      margin: 0;
      padding: 1rem;
    }
    .main-content { 
      background: #2a2a2a; 
      padding: 1.5rem; 
      border-radius: 8px;
      margin: 0 auto;
      max-width: 800px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: #ffffff; }
    h2 { font-size: 1.2rem; font-weight: 600; margin: 1.5rem 0 0.5rem 0; color: #60a5fa; border-bottom: 1px solid #333; padding-bottom: 0.3rem; }
    h3 { font-size: 1.05rem; font-weight: 600; margin: 1rem 0 0.4rem 0; color: #93c5fd; }
    h4 { font-size: 0.95rem; font-weight: 600; margin: 0.8rem 0 0.3rem 0; color: #c0c0c0; }
    p { font-size: 15px; margin: 0.6rem 0; color: #d0d0d0; }
    li { font-size: 15px; margin: 0.3rem 0; color: #d0d0d0; }
    strong { color: #ffffff; font-weight: 600; }
    hr { border: none; border-top: 1px solid #333; margin: 1rem 0; }
    blockquote { 
      background: #333; 
      padding: 0.8rem; 
      border-radius: 4px; 
      margin: 1rem 0;
      border-left: 3px solid #f87171;
    }
  </style>
</head>
<body>
  <div class="main-content">
    {{ .Content }}
  </div>
</body>
</html>
