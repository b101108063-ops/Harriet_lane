baseURL = 'https://b101108063-ops.github.io/Harriet_lane/'
languageCode = 'en-us'
title = 'Harriet Lane Handbook'
theme = 'PaperMod'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      headingIDs = false

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 5

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 10

[frontmatter]
date = ["date", "publishDate", "lastmod"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats.JSON]
  mediatype = "application/json"
  baseName = "index"
  isPlainText = true
